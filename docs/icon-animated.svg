<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Replay — posts a 13-point final score first, then prices which of the 1,287 orderings produced it, animated">
<title>Replay — posts a 13-point final score first, then prices which of the 1,287 orderings produced it</title>
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-8%    steady state: the finished mark — amber staircase, green ticket line at -4,
                        zero line, socket field, bezel. Frame 0 is the static icon.
  8-20%   trigger:      the reachable envelope opens outward from the zero line —
                        the shape of an 8-5 board becomes legible          data-story="beat-2"
  20-46%  mechanism:    Amber path touches the green ticket line at point four; the line holds green won, not red dead.
                                                                          data-story="beat-3"
  46-62%  resolution:   the head settles at +3 on point 13, reconciling with the
                        posted score; the ticket line holds green — it paid data-story="beat-4"
  62-90%  the near-miss: The same ticket, one row short: the curve re-touches minus three and the row it needed stays green, one apart.
                        The board dims, the curve re-draws at red d2, and the two
                        rows sit one apart — green needed, red reached. No new
                        sound, no swell. The silence is the point.        data-story="beat-5"
  90-100% breathe + seam fade: story layers return to 0, the mark alone remains
-->

name: gitleaks

# The mechanical version of this system's hard rule: "before any public flip, scan
# history for kitchen filenames and secrets." This repo flips private -> public at
# submission, and fetch-depth 0 is what makes the scan cover the commits that flip
# exposes rather than only the tip.

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

# Declared explicitly because the default token on a Dependabot pull_request is
# read-only and scoped down: gitleaks-action lists the PR's commits, and without
# pull-requests: read it dies on a 403 that looks like a scanner failure rather than a
# permissions one. main was always green; only the bot's own PRs failed.
permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # full history — the point is to scan the past
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
